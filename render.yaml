services:
  - type: web
    name: tennis-equipment-prices
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd streamlit && streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: MONGO_CNX_STRING
        sync: false
