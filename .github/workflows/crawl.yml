name: Crawl tennis prices
on:
  schedule:
    - cron: '0 6 * * 1'   # Every Monday, 06:00 UTC
  workflow_dispatch: {}

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: Run crawlers
        working-directory: Crawlers
        env:
          MONGO_CNX_STRING: ${{ secrets.MONGO_CNX_STRING }}
          WEBSHARE_PROXY_URLS: ${{ secrets.WEBSHARE_PROXY_URLS }}
        run: |
          python DirectTennisCrawler.py
          python TennisNutsCrawler.py
          python TennisPointCrawler.py
          python TennisWarehouseEuropeCrawler.py
