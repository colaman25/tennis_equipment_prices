name: Crawl tennis prices
on:
  schedule:
    - cron: '0 6 * * 1'   # Every Monday, 06:00 UTC
  workflow_dispatch: {}

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - name: Run crawlers
        working-directory: Crawlers
        env:
          MONGO_CNX_STRING: ${{ secrets.MONGO_CNX_STRING }}
          WEBSHARE_PROXY_URLS: ${{ secrets.WEBSHARE_PROXY_URLS }}
        run: |
          python DirectTennisCrawler.py
          python TennisNutsCrawler.py
          python TennisPointCrawler.py
          python TennisWarehouseEuropeCrawler.py
      - name: Match products across sources
        working-directory: Crawlers
        env:
          MONGO_CNX_STRING: ${{ secrets.MONGO_CNX_STRING }}
        run: python product_matcher.py
      - name: Install MongoDB Database Tools
        run: |
          wget -q https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.9.4.deb
          sudo dpkg -i mongodb-database-tools-ubuntu2204-x86_64-100.9.4.deb
      - name: Backup MongoDB to Backblaze B2
        env:
          MONGO_CNX_STRING: ${{ secrets.MONGO_CNX_STRING }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          pip install --quiet b2
          mongodump --uri="$MONGO_CNX_STRING" --archive=backup.gz --gzip
          b2 account authorize "$B2_KEY_ID" "$B2_APPLICATION_KEY"
          b2 file upload tennis-equipment-backup backup.gz "backups/$(date +%Y%m%d).gz"
